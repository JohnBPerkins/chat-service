name: CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Run build
      run: npm run build

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: matrix.node-version == '20.x'
      with:
        directory: ./frontend/coverage
        flags: frontend

  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        go-version: [1.22.x, 1.23.x]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Run integration tests
      run: go test -v ./tests/integration/...

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: matrix.go-version == '1.23.x'
      with:
        file: ./backend/coverage.out
        flags: backend

  # Docker builds removed - Railway handles production builds
  # Keeping this job as placeholder for future Docker registry pushes if needed

  security-scan:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  integration-test:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:latest
        ports:
          - 4222:4222

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.23.x

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Install backend dependencies
      working-directory: ./backend
      run: go mod download

    - name: Wait for services to be ready
      run: |
        echo "Waiting for MongoDB..."
        until nc -z localhost 27017; do sleep 1; done
        echo "Waiting for NATS..."
        until nc -z localhost 4222; do sleep 1; done
        echo "Services are ready!"

    - name: Run integration tests
      working-directory: ./backend
      env:
        MONGODB_URI: mongodb://admin:password@localhost:27017/chat-service-test?authSource=admin
        NATS_URL: nats://localhost:4222
        JWT_SECRET: test-secret-key-for-ci
      run: go test -v ./tests/integration/...

  notify:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, integration-test]
    if: always()

    steps:
    - name: Notify on success
      if: needs.frontend-test.result == 'success' && needs.backend-test.result == 'success' && needs.integration-test.result == 'success'
      run: echo "✅ All CI checks passed!"

    - name: Notify on failure
      if: needs.frontend-test.result == 'failure' || needs.backend-test.result == 'failure' || needs.integration-test.result == 'failure'
      run: |
        echo "❌ CI checks failed!"
        echo "Frontend: ${{ needs.frontend-test.result }}"
        echo "Backend: ${{ needs.backend-test.result }}"
        echo "Integration: ${{ needs.integration-test.result }}"
        exit 1