# NATS Server Configuration with Monitoring

# Server name
server_name: "chat-nats"

# Listen for client connections
port: 4222

# Enable JetStream
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}

# HTTP monitoring endpoint
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# Limits
max_connections: 1000
max_payload: 10MB
max_pending: 100MB
