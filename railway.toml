[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"
# Only watch specific paths, excluding frontend directory
watchPaths = ["backend/**", "*.go", "go.mod", "go.sum", "Dockerfile", "railway.toml"]

[deploy]
startCommand = "./main"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 30

[env]
# Railway will auto-generate PORT, but we can set our default
PORT = "8080"