[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.ws"
dockerContext = "backend"
watchPaths = ["backend/**"]

[deploy]
startCommand = "./ws"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 30

[env]
# Railway will auto-generate PORT, but we can set our default
PORT = "8081"
